<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Atlas Environmental Terrain Viewer"
  >

  <title>Atlas — Environmental Terrain</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <!-- ============================================================
       APPLICATION
       ============================================================ -->

  <div id="app">

    <!-- ==========================================================
         3D VIEWPORT
         ========================================================== -->

    <main
      id="terrain-viewer"
      aria-label="3D environmental terrain viewer"
    ></main>


    <!-- ==========================================================
         TOP BAR
         ========================================================== -->

    <header class="topbar">

      <div class="brand">

        <div class="brand-mark">
          A
        </div>

        <div class="brand-copy">

          <div class="brand-title">
            ATLAS
          </div>

          <div class="brand-subtitle">
            Environmental Terrain
          </div>

        </div>

      </div>


      <div class="topbar-status">

        <span class="status-indicator"></span>

        <span id="renderer-status">
          TERRAIN ENGINE
        </span>

      </div>

    </header>


    <!-- ==========================================================
         ENVIRONMENT SWITCHER
         ========================================================== -->

    <aside
      class="environment-panel"
      aria-label="Environment selector"
    >

      <div class="panel-header">

        <div>

          <div class="panel-eyebrow">
            ENVIRONMENT
          </div>

          <h1 id="environment-title">
            Mountain Range
          </h1>

        </div>

        <div class="panel-index">
          01
        </div>

      </div>


      <!-- Populated from data/mountains.json by app.js -->

      <div
        class="environment-list"
        aria-live="polite"
      ></div>

    </aside>


    <!-- ==========================================================
         VIEW CONTROLS
         ========================================================== -->

    <div class="viewer-controls">

      <div class="control">

        <span class="control-key">
          DRAG
        </span>

        <span>
          Orbit
        </span>

      </div>

      <div class="control">

        <span class="control-key">
          SCROLL
        </span>

        <span>
          Zoom
        </span>

      </div>

      <div class="control">

        <span class="control-key">
          RIGHT DRAG
        </span>

        <span>
          Pan
        </span>

      </div>


      <div class="control-actions">

        <button
          id="reset-view"
          class="viewer-action"
          type="button"
        >

          <span class="action-label">
            RESET VIEW
          </span>

        </button>

        <button
          id="toggle-wireframe"
          class="viewer-action active"
          type="button"
          aria-pressed="true"
        >

          <span class="action-label">
            WIREFRAME
          </span>

          <span class="action-state">
            ON
          </span>

        </button>

        <button
          id="toggle-rotate"
          class="viewer-action active"
          type="button"
          aria-pressed="true"
        >

          <span class="action-label">
            ROTATE
          </span>

          <span class="action-state">
            ON
          </span>

        </button>

      </div>

    </div>


    <!-- ==========================================================
         TERRAIN INFORMATION
         ========================================================== -->

    <div class="terrain-info">

      <div class="info-item">

        <span class="info-label">
          TERRAIN
        </span>

        <span
          class="info-value"
          id="terrain-type"
        >
          MOUNTAIN RANGE
        </span>

      </div>

      <div class="info-item">

        <span class="info-label">
          MODE
        </span>

        <span
          class="info-value"
          id="terrain-mode"
        >
          PROCEDURAL
        </span>

      </div>

      <div class="info-item">

        <span class="info-label">
          DIMENSION
        </span>

        <span class="info-value">
          3D
        </span>

      </div>

      <div class="info-item">

        <span class="info-label">
          SOURCE
        </span>

        <span
          class="info-value"
          id="data-source"
        >
          DATASET
        </span>

      </div>

    </div>


    <!-- ==========================================================
         LOADING INDICATOR
         ========================================================== -->

    <div
      id="loading"
      class="loading"
    >

      <div class="loading-line"></div>

      <span>
        INITIALIZING TERRAIN
      </span>

    </div>

  </div>


  <!-- ============================================================
       THREE.JS IMPORT MAP
       ============================================================ -->

  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/examples/jsm/"
    }
  }
  </script>


  <!-- ============================================================
       APPLICATION
       ============================================================ -->

  <script
    type="module"
    src="./app.js"
  ></script>

</body>
</html>
